services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    command: ["hermes", "--slack"]
  hermes-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-api
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    ports:
      - "8788:8787"
    command: ["hermes-api", "--host", "0.0.0.0", "--port", "8787"]
    networks:
      - hermes-shared
  hermes-crm-queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-crm-queue-worker
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    command: ["hermes", "--run-crm-queue-worker", "--crm-queue-poll-seconds", "5"]
  hermes-intake-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-intake-worker
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    command: ["hermes", "--run-intake-worker", "--intake-poll-seconds", "5"]
  hermes-outbound-drain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-outbound-drain
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    # Hermes's single outbound scheduler: drains outbound_sync_queue every 15
    # min. Replaces the retired pg_cron rsg-sync outbound path (pg_cron stays
    # disabled).
    command: ["hermes", "--run-outbound-drain-worker", "--outbound-drain-poll-seconds", "900"]

networks:
  hermes-shared:
    external: true
