services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    command: ["hermes", "--slack"]
  hermes-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-api
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    ports:
      - "8788:8787"
    command: ["hermes-api", "--host", "0.0.0.0", "--port", "8787"]
    networks:
      - hermes-shared
  espo-mcp:
    build:
      context: ./mcp/espo
      dockerfile: Dockerfile
    container_name: rsg-espo-mcp
    env_file:
      - .env
    environment:
      ESPO_MCP_PORT: "3000"
      ESPO_MCP_MAX_LIST_SIZE: "200"
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - hermes-shared
  hermes-crm-queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-crm-queue-worker
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    command: ["hermes", "--run-crm-queue-worker", "--crm-queue-poll-seconds", "5"]
  hermes-openclaw-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-openclaw-worker
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    command: ["hermes", "--run-openclaw-worker", "--openclaw-poll-seconds", "5"]
    networks:
      - hermes-shared

networks:
  hermes-shared:
    external: true
