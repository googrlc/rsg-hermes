services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    command: ["hermes", "--slack"]
  hermes-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-api
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    ports:
      - "8788:8787"
    command: ["hermes-api", "--host", "0.0.0.0", "--port", "8787"]
    networks:
      - hermes-shared
  hermes-crm-queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-crm-queue-worker
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    command: ["hermes", "--run-crm-queue-worker", "--crm-queue-poll-seconds", "5"]
  n8n:
    image: n8nio/n8n:latest
    container_name: rsg-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PATH=/n8n/
      - WEBHOOK_URL=https://hermes-j21v6-u69864.vm.elestio.app/n8n/
      - GENERIC_TIMEZONE=America/New_York
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - hermes-shared

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rsg-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - open-webui_data:/app/backend/data
    networks:
      - hermes-shared

volumes:
  n8n_data:
  open-webui_data:

networks:
  hermes-shared:
    external: true
