# MUTABLE STATE LIVES IN A VOLUME, NOT IN THE CODE TREE.
#
# The repo is NO LONGER bind-mounted into the containers. The Dockerfile does
# `COPY . .`, so the image carries the code and personas/; the old `.:/app` mount
# only shadowed it with the host tree. That mount caused two incidents on
# 2026-07-26: a `docker cp` restore wrote an older image copy of api.py over the
# host tree (silently reverting the box below its committed HEAD), and a bad `-v`
# flag created a directory named `hermes/operations/staleness.py` inside the repo.
# It was also why the bridge's app.py showed owner dnsmasq:1000 — container writes
# from more than one process.
#
# DEPLOYS ARE NOW BUILD-ONLY. `git pull` alone no longer updates running code;
# every deploy must rebuild the image:
#   docker compose up -d --build            # hermes / hermes-api / intake worker
#   docker compose --profile scheduler up -d --build hermes-scheduler
# Cron entries already use `docker compose run --rm hermes ...`, which uses the
# image, so they are unaffected.
#
# Prerequisite that made this safe: the three job-idempotency files that used to
# live at .hermes/ (relative paths resolving against WORKDIR /app) moved to the
# named hermes-state volume at /var/lib/hermes, and are pointed at below via
# HERMES_*_STATE_FILE env overrides. Nothing else writes under /app at runtime
# (INTAKE_FOLDER_PATH is not used; HERMES_PERSONA_FILE is read-only from the
# image). Compose prefixes named volumes with the project name, so on the box the
# volume is rsg-hermes_hermes-state, not hermes-state.
services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - hermes-state:/var/lib/hermes
    environment:
      # Absolute paths into the state volume. These OVERRIDE the relative paths in
      # .env (.hermes/*.json), which resolved into the bind-mounted code tree.
      HERMES_SENTINEL_STATE_FILE: /var/lib/hermes/sentinel_state.json
      HERMES_COMMISSION_AUDIT_STATE_FILE: /var/lib/hermes/commission_audit_state.json
      HERMES_EOM_SCORECARD_STATE_FILE: /var/lib/hermes/eom_scorecard_state.json
    # Per-cron runner, not a listener: jobs run as
    #   docker compose run --rm hermes hermes --<job>
    # Default command is a harmless read-only check so a plain `up -d`
    # cannot crash-loop. restart: no for the same reason.
    restart: "no"
    command: ["hermes", "--ops-doctor"]
  hermes-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-api
    env_file:
      - .env
    volumes:
      - hermes-state:/var/lib/hermes
    environment:
      # Absolute paths into the state volume. These OVERRIDE the relative paths in
      # .env (.hermes/*.json), which resolved into the bind-mounted code tree.
      HERMES_SENTINEL_STATE_FILE: /var/lib/hermes/sentinel_state.json
      HERMES_COMMISSION_AUDIT_STATE_FILE: /var/lib/hermes/commission_audit_state.json
      HERMES_EOM_SCORECARD_STATE_FILE: /var/lib/hermes/eom_scorecard_state.json
    restart: unless-stopped
    ports:
      - "8788:8787"
    command: ["hermes-api", "--host", "0.0.0.0", "--port", "8787"]
    networks:
      - hermes-shared
  # hermes-crm-queue-worker removed 2026-07-21: it drained the EspoCRM-era
  # crm_write_queue, which was dropped in the EspoCRM decommission. The service
  # crash-looped on `SELECT crm_write_queue` (404). EspoCRM is gone; this worker
  # has no queue to drain. (The enqueue helper in api.py is now dead code, to be
  # removed in a separate cleanup.)
  hermes-intake-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-intake-worker
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - hermes-state:/var/lib/hermes
    restart: unless-stopped
    command: ["hermes", "--run-intake-worker", "--intake-poll-seconds", "5"]
  hermes-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-hermes-scheduler
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - hermes-state:/var/lib/hermes
    restart: unless-stopped
    # Executor scheduler: renewal, intake, quote, casework and
    # opportunity-writeback every 5 min with single-instance
    # locking, backoff/dead-letter, stalled-queue reclaim, and #systems-check
    # alerts. DISABLED by default TWO ways:
    #   1. compose profile "scheduler" — a plain `docker compose up -d` skips it;
    #      start explicitly with `docker compose --profile scheduler up -d hermes-scheduler`.
    #   2. SCHEDULER_ENABLED env — the command exits immediately unless truthy.
    profiles: ["scheduler"]
    # Let the in-flight cycle finish on SIGTERM so no claimed job is abandoned.
    stop_grace_period: 60s
    command: ["hermes", "--run-scheduler", "--scheduler-interval", "300", "--scheduler-batch", "10"]

  # SharePoint MCP — read-only agency knowledge for Amy (Graph app-only auth).
  # Host port bound to loopback only; public egress via nginx (see
  # scripts/install_sharepoint_mcp_egress.sh). On hermes-gretch there is no
  # host .venv — start this service instead of uvicorn on the shell.
  sharepoint-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsg-sharepoint-mcp
    # On hermes-gretch: MS365_* may still live in repo .env; secrets canonical in
    # /opt/app/.env (HERMES_ENV_FILE). Later file wins on duplicate keys.
    env_file:
      - .env
      - ${HERMES_ENV_FILE:-.env}
    environment:
      SHAREPOINT_MCP_TRANSPORT: http
      SHAREPOINT_MCP_HOST: "0.0.0.0"
      SHAREPOINT_MCP_PORT: "8082"
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped
    command: ["python3", "sharepoint_mcp.py"]
    networks:
      - hermes-shared

volumes:
  # Job-idempotency state: sentinel "already sent today", commission-audit and
  # EOM-scorecard watermarks. Named so it survives compose down/up and container
  # recreates — losing it makes a report re-send, which is externally visible.
  hermes-state:

networks:
  hermes-shared:
    external: true
