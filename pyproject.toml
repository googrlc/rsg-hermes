[project]
name = "rsg-hermes"
version = "0.1.0"
description = "Hermes — EspoCRM coordinator (CLI, Slack, REST client)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
  "slack-bolt>=1.18.0",
  "openai>=1.30.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  # Command Center (intake lane engine)
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "openpyxl>=3.1",
  "python-multipart>=0.0.6",
  # Renewal cadence email drafts (hermes/renewals/emails.py)
  "jinja2>=3.1",
  # Renewal worksheet PDF generation (hermes/renewals/pdf.py). Pinned so the
  # image is reproducible; also force-installed in the Dockerfile.
  "reportlab==5.0.0",
  # Voice output — free Edge TTS (no API key needed).
  "edge-tts>=6.1",
]

[project.optional-dependencies]
# Read-only direct-Postgres lane to EspoCRM (hermes/integrations/espo_db.py).
# Install with: pip install -e '.[db]'
db = ["psycopg[binary]>=3.1"]
# Gmail email-triage lane (hermes/integrations/gmail_client.py): service-account
# token minting + domain-wide delegation. Install with: pip install -e '.[gmail]'
gmail = ["google-auth>=2.20"]

[project.scripts]
hermes = "hermes.main:main"
hermes-api = "hermes.api:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes*"]

[tool.setuptools.package-data]
"hermes.data" = ["*.csv"]
"hermes.renewals" = ["templates/*.j2"]
