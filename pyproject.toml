[project]
name = "rsg-hermes"
version = "0.1.0"
description = "Hermes — agency CRM coordinator (CLI, Slack, REST client)"
readme = "README.md"
# Upper bound required so poetry can resolve deps that cap Python (e.g. reportlab <4).
requires-python = ">=3.11,<4"
dependencies = [
  # NOTE: rsg-hermes-core is deliberately NOT listed here. It is a path package
  # in packages/, not something resolvable from an index, and Poetry — which the
  # Dockerfile uses for the dependency install — reads PEP 621 [project] but not
  # [tool.uv.sources]. Listing it made `poetry lock` try PyPI and fail the image
  # build with "doesn't match any versions". The Dockerfile installs it
  # explicitly before installing this app; pytest gets it via pythonpath below.
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
  "slack-bolt>=1.18.0",
  "openai>=1.30.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  # Command Center (intake lane engine)
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "pymupdf>=1.24",  # render scanned PDF pages for the vision OCR tier (bundled libs, no system deps)
  "openpyxl>=3.1",
  "python-multipart>=0.0.6",
  # Renewal cadence email drafts (hermes/renewals/emails.py)
  "jinja2>=3.1",
  # Renewal worksheet PDF generation (hermes/renewals/pdf.py). Pinned so the
  # image is reproducible; also force-installed in the Dockerfile.
  "reportlab==5.0.0",
  # Proposal HTML→PDF rendering (hermes/proposals/generator.py). Needs native
  # Pango libs (added in the Dockerfile); also force-installed there.
  "weasyprint>=60",
  # Voice output — free Edge TTS (no API key needed).
  "edge-tts>=6.1",
]

[project.optional-dependencies]
# Gmail email-triage lane (hermes/integrations/gmail_client.py): service-account
# token minting + domain-wide delegation. Install with: pip install -e '.[gmail]'
gmail = ["google-auth>=2.20"]

[project.scripts]
hermes = "hermes.main:main"
hermes-api = "hermes.api:main"

[tool.pytest.ini_options]
# The shared bottom layer is a separate distribution under packages/. In an
# image it is pip-installed before the app; for a plain `pytest` in a checkout
# this puts it on the path so the suite runs without an install step.
pythonpath = ["packages/rsg-hermes-core"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes*"]

[tool.setuptools.package-data]
"hermes.renewals" = ["templates/*.j2"]
# ACORD form catalog + question catalog are loaded at runtime — must ship in the wheel/image.
"hermes.deliverables" = ["*.yaml", "*.json"]
