title: "RSG Hermes"
description: "Hermes CRM form and documentation"
url: "https://googrlc.github.io"
baseurl: "/rsg-hermes"

theme: jekyll-theme-architect
markdown: kramdown

source: docs
destination: _site

# Keep Jekyll focused on the docs site content.
exclude:
  - .github
  - .git
  - Dockerfile
  - docker-compose.yml
  - .dockerignore
  - .env.example
  - pyproject.toml
  - poetry.lock
  - README.md
  - hermes
  - openwebui
  - supabase
  - tests
