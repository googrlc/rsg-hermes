# SharePoint MCP bridge — public Copilot Studio egress (parallel to hermes-mcp).
# Install on hermes-gretch Elestio nginx:
#   /opt/elestio/nginx/conf.d/sharepoint-mcp.risksolutionsgroup.net.conf
#
# Prerequisite: DNS A record sharepoint-mcp.risksolutionsgroup.net → box public IP
# TLS: same cert paths as hermes-mcp vhost unless you add a custom-domain cert.

server {
    listen 443 ssl;
    server_name sharepoint-mcp.risksolutionsgroup.net;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location /healthz {
        proxy_pass http://127.0.0.1:8082/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8082/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /api/mcp {
        proxy_pass http://127.0.0.1:8082/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
