# Hermes MCP bridge — public Copilot Studio egress (Option A).
# Install on hermes-gretch Elestio nginx:
#   /opt/elestio/nginx/conf.d/hermes-mcp.risksolutionsgroup.net.conf
#
# Prerequisite: DNS A record hermes-mcp.risksolutionsgroup.net → box public IP
# TLS: replace ssl_certificate paths with Elestio/Let's Encrypt paths for this host.

server {
    listen 443 ssl;
    server_name hermes-mcp.risksolutionsgroup.net;

    ssl_certificate     /etc/nginx/ssl/hermes-mcp.risksolutionsgroup.net.crt;
    ssl_certificate_key /etc/nginx/ssl/hermes-mcp.risksolutionsgroup.net.key;

    # MCP bridge only — no Command Center UI on this vhost.
    location /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8081/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /api/mcp {
        proxy_pass http://127.0.0.1:8081/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
