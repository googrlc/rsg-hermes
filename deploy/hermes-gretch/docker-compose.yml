# hermes-gretch — Gretchen's Hermes instance.
#
# Same image as Lamar's Hermes, built from the same repo. The ONLY differences
# are environment: a Gretchen persona, a dedicated agent id, dedicated Slack bot
# tokens, a dedicated EspoCRM API user, and an isolated Supermemory scope.
#
# Deploy from the repo root:
#   docker compose -f deploy/hermes-gretch/docker-compose.yml up -d --build
#
# NOTE: no bind-mount of the repo (unlike the dev compose) — the image carries the
# code and personas/, so Gretchen's container is self-contained and immutable.
# NOTE: NowCerts is intentionally absent. This instance has no NOWCERTS_* env and
# mounts no mcp/nowcerts — all AMS writes go through the existing gated CRM queue.

services:
  hermes-gretch:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: rsg-hermes:latest
    container_name: rsg-hermes-gretch
    network_mode: "host"
    env_file:
      - ../../.env.hermes-gretch
    environment:
      - HERMES_AGENT_ID=hermes-gretch
      - HERMES_PERSONA_FILE=/app/personas/SOUL-GRETCHEN.md
      - HERMES_MEMORY_SCOPE=hermes-gretch
      # Gretchen's scope is the CRM — no public-web business research.
      - HERMES_DISABLED_TOOLS=web_research
    # NOTE: this instance existed to run the Slack Socket Mode listener,
    # which is retired — it has no listener role today. Harmless read-only
    # default so it cannot crash-loop; decide its purpose before enabling.
    restart: "no"
    command: ["hermes", "--ops-doctor"]
