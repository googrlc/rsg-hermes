<!--
  HERMES AGENCY COMMAND CENTER — served from hermes-api at /command-center/
  Phase 1: Renewals Cockpit wired to GET /api/command-center/renewals (live,
  server-side service-role read of project_85_renewals). Other modules are
  intentionally absent until their phase ships with live data ("ship ugly").
  Shell/theme ported from the approved mockup (native Hermes navy).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes — Command Center</title>
<style>
  :root{
    --sidebar:#16213e; --bg:#1a1a2e; --panel:#1e2746; --border:#2b375e;
    --border-soft:#243156; --text:#e7ecf6; --muted:#8b96b0; --muted-2:#5f6b8a;
    --orange:#f97316; --orange-soft:#f9731622; --blue:#4a9eff; --teal:#2dd4bf;
    --green:#22c55e; --red:#ef4444; --amber:#f5b942; --radius:10px;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 500px at 78% -10%, #4a9eff14, transparent 60%),radial-gradient(700px 400px at 0% 100%, #f9731610, transparent 55%)}
  .app{display:grid;grid-template-columns:56px 1fr;height:100vh;position:relative;z-index:1}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#2f3c66;border-radius:8px}

  /* icon rail */
  .rail{background:#121a30;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#fb923c,#f97316);display:grid;place-items:center;font-weight:700;color:#1a1a2e;font-size:18px;margin-bottom:10px;box-shadow:0 4px 14px #f9731640}
  .rb{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:16px;border:1px solid transparent}
  .rb.active{background:var(--orange-soft);color:var(--orange);border-color:#f9731644}
  .rail-spacer{flex:1}

  /* main */
  .center{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .topbar{height:54px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--sidebar);flex-shrink:0}
  .topbar .b{display:flex;align-items:baseline;gap:8px}
  .topbar .b b{font-size:15px}
  .topbar .b span{font-family:var(--mono);font-size:10px;color:var(--muted-2)}
  .topbar h1{font-size:13px;font-weight:600;flex:1;color:var(--muted);text-align:right}
  .tag{font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--border);color:var(--muted);background:#141d36;display:flex;align-items:center;gap:6px}
  .tag.live{color:var(--teal);border-color:#2dd4bf44}
  .view{flex:1;overflow-y:auto;padding:20px 22px 60px}

  .dash-hd{margin-bottom:16px}
  .dash-hd .t{font-size:20px;font-weight:700;letter-spacing:-.3px}
  .dash-hd .t small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:4px}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .card .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .card .ch .lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  .card .ch .ico{font-size:14px;color:var(--muted-2)}

  .seg{display:flex;gap:8px;margin-bottom:10px}
  .segbox{flex:1;text-align:center;background:#0e1526;border:1px solid var(--border);border-radius:8px;padding:10px 4px}
  .segbox b{display:block;font-family:var(--mono);font-size:18px}
  .segbox span{font-size:9.5px;color:var(--muted);letter-spacing:.5px}
  .segbox .pm{font-size:9.5px;color:var(--muted-2);font-family:var(--mono);margin-top:2px}
  .segbox.hot b{color:#ff6b78}.segbox.soon b{color:var(--amber)}

  .pastdue{display:flex;align-items:center;gap:8px;background:#ef44441a;border:1px solid #6b2330;color:#ff9aa6;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px}
  .pastdue b{font-family:var(--mono)}

  .rowline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px}
  .rowline:last-child{border-bottom:none}
  .rowline .nm{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowline .sub{font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400}
  .prem{font-family:var(--mono);text-align:right;min-width:78px}
  .prem .delta{display:block;font-size:9.5px;color:var(--muted-2)}
  .chip{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap;min-width:64px;text-align:center}
  .chip.hot{background:#ef444420;color:#ff6b78}
  .chip.soon{background:#f5b94220;color:var(--amber)}
  .chip.ok{background:#22c55e20;color:#4ade80}

  .riskbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .rpill{display:flex;align-items:center;gap:6px;font-size:11px;padding:5px 10px;border-radius:20px;background:#0e1526;border:1px solid var(--border)}
  .rpill b{font-family:var(--mono)}
  .rpill .pdot{width:7px;height:7px;border-radius:50%}
  .rpill .pm{color:var(--muted-2);font-family:var(--mono);font-size:10px}
  .empty,.err{color:var(--muted);font-size:12.5px;padding:18px 0;text-align:center}
  .err{color:#ff9aa6}
  .note{font-size:11px;color:var(--muted-2);line-height:1.6;padding:4px 2px}
  .note b{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="logo">H</div>
    <div class="rb" title="Chats">💬</div>
    <div class="rb active" title="Command Center">⊞</div>
    <div class="rb" title="Renewals">🔄</div>
    <div class="rail-spacer"></div>
    <div class="rb" title="Connected" style="color:var(--green)">✅</div>
  </nav>

  <main class="center">
    <div class="topbar">
      <div class="b"><b>Hermes</b><span>Command Center</span></div>
      <h1 id="asof">loading…</h1>
      <span class="tag live">● live data</span>
    </div>

    <div class="view">
      <div class="dash-hd">
        <div class="t">Renewals Cockpit
          <small>Protecting the book — every policy renewing in the next 90 days, most urgent first. Source: <code>project_85_renewals</code>.</small>
        </div>
      </div>

      <div class="card">
        <div class="ch"><span class="lbl">Upcoming renewals · next 90 days</span><span class="ico">🔄</span></div>

        <div class="seg" id="seg">
          <div class="segbox hot"><b>–</b><span>≤ 7 DAYS</span><div class="pm"></div></div>
          <div class="segbox soon"><b>–</b><span>≤ 30 DAYS</span><div class="pm"></div></div>
          <div class="segbox"><b>–</b><span>≤ 60 DAYS</span><div class="pm"></div></div>
          <div class="segbox"><b>–</b><span>≤ 90 DAYS</span><div class="pm"></div></div>
        </div>

        <div class="riskbar" id="riskbar"></div>

        <div class="pastdue" id="pastdue" style="display:none"></div>

        <div id="list"><div class="empty">Loading renewals…</div></div>
      </div>

      <div class="note" id="datanote"></div>
    </div>
  </main>
</div>

<script>
  const fmtMoney = (n) => {
    if (n == null) return "—";
    if (n >= 1000) return "$" + (n/1000).toFixed(n >= 10000 ? 0 : 1) + "K";
    return "$" + Math.round(n);
  };
  const chipFor = (d) => {
    if (d <= 7) return ['hot', d + (d===1?' day':' days')];
    if (d <= 30) return ['soon', d + ' days'];
    return ['ok', d + ' days'];
  };

  async function load() {
    let data;
    try {
      const res = await fetch('/api/command-center/renewals', {headers:{'Accept':'application/json'}});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
    } catch (e) {
      document.getElementById('list').innerHTML =
        '<div class="err">⚠ Could not load renewals (' + e.message + '). Is hermes-api reachable and Supabase configured?</div>';
      document.getElementById('asof').textContent = 'data unavailable';
      return;
    }

    document.getElementById('asof').textContent = 'as of ' + data.as_of;

    // cumulative urgency boxes
    const b = data.buckets;
    const cum = [
      b.le7.count,
      b.le7.count + b.le30.count,
      b.le7.count + b.le30.count + b.le60.count,
      b.le7.count + b.le30.count + b.le60.count + b.le90.count,
    ];
    const cumPrem = [
      b.le7.premium_current,
      b.le7.premium_current + b.le30.premium_current,
      b.le7.premium_current + b.le30.premium_current + b.le60.premium_current,
      b.le7.premium_current + b.le30.premium_current + b.le60.premium_current + b.le90.premium_current,
    ];
    const boxes = document.querySelectorAll('#seg .segbox');
    boxes.forEach((box, i) => {
      box.querySelector('b').textContent = cum[i];
      box.querySelector('.pm').textContent = fmtMoney(cumPrem[i]);
    });

    // risk breakdown (populated by the classification refresh job)
    const RISK_META = {
      CRITICAL: ['#ff6b78', 'Critical'], AT_RISK: ['#f5b942', 'At risk'],
      LAPSED: ['#8b96b0', 'Lapsed'], RENEWED: ['#4ade80', 'Renewed'], SAFE: ['#4a9eff', 'Safe'],
    };
    const br = data.by_risk || {};
    const rb = document.getElementById('riskbar');
    rb.innerHTML = Object.keys(RISK_META).map(k => {
      const s = br[k] || {count:0, premium_current:0};
      const [color, label] = RISK_META[k];
      return '<span class="rpill"><span class="pdot" style="background:'+color+'"></span>'
        + label + ' <b>' + s.count + '</b> <span class="pm">' + fmtMoney(s.premium_current) + '</span></span>';
    }).join('');

    // past-due banner (the silent lapses behind the 54.92% retention number)
    if (data.past_due_count > 0) {
      const pd = document.getElementById('pastdue');
      pd.style.display = 'flex';
      pd.innerHTML = '⚠ <span><b>' + data.past_due_count + '</b> renewals are already past their expiration date ('
        + fmtMoney(b.past_due.premium_current) + ' premium). These need date cleanup / classification — likely lapses.</span>';
    }

    // upcoming list
    const list = document.getElementById('list');
    if (!data.upcoming.length) {
      list.innerHTML = '<div class="empty">No renewals in the next 90 days.</div>';
    } else {
      list.innerHTML = data.upcoming.map(r => {
        const [cls, label] = chipFor(r.days_until);
        const incr = (r.increase_percentage && Math.abs(r.increase_percentage) >= 0.1)
          ? '<span class="delta">' + (r.increase_percentage > 0 ? '▲' : '▼') + ' ' + Math.abs(r.increase_percentage).toFixed(1) + '%</span>'
          : '';
        return '<div class="rowline">'
          + '<span class="nm">' + (r.client_name || 'Unknown client')
          + '<br><span class="sub">' + (r.policy_number || '—')
          + (r.risk_status && r.risk_status !== 'SAFE' ? ' · ' + r.risk_status : '') + '</span></span>'
          + '<span class="prem">' + fmtMoney(r.premium_current) + incr + '</span>'
          + '<span class="chip ' + cls + '">' + label + '</span>'
          + '</div>';
      }).join('');
    }

    // honest data-quality footnote
    document.getElementById('datanote').innerHTML =
      '<b>' + data.total + '</b> total renewal records · <b>' + data.upcoming_count + '</b> upcoming (≤90d) · <b>'
      + data.past_due_count + '</b> past-due. '
      + 'Renewal premium &amp; increase % only show once the classification/refresh step has populated them.';
  }
  load();
</script>
</body>
</html>
